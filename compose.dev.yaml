services:
  postgres:
    image: postgres:18
    container_name: postgres-wallet
    restart: unless-stopped
    env_file: config.env  
 #   environment:
 #     - POSTGRES_DB=${POSTGRES_DB}
 #     - POSTGRES_USER=${POSTGRES_USER}
 #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
       - "${PG_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10  
    networks: [wallet-net]
 
  migrator:
    build:
      context: .
      dockerfile: migration.Dockerfile
    network_mode: host  
    env_file: config.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: golang:1.27.3-alpine
    working_dir: /app
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
#      - ./config.env:/app/.env:ro     
      - go-build:/root/.cache/go-build
    env_file: config.env    
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: go run ./cmd/grpc_server
    network_mode: host


volumes:
  pgdata:
  go-mod:
  go-build:

networks:
  wallet-net:
    driver: bridge
